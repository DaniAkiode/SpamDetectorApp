<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <title>Spam Detection Application</title>
    </head>
    <body>
        <div class="container">
            <h2>Spam Detection Application</h2>
            <form method="post">
                <label for="message">Enter Email Here For Spam Detection</label>
                <textarea id = "message" name="message" rows="4" cols="50"></textarea>
                <br>

                <label for="model">Select Model:</label>
                <select name="model" id="model">
                    <option value="naive_bayes">Naive Bayes</option>
                    <option value="random_forest">Random Forest</option>    
                    <option value="naive_bayes2">Naive Bayes 2</option>
                    <option value="naive_bayes3">Naive Bayes 3</option>
                    <option value="logic_regression">Logical Regression</option>
                    <option value="knn">KNN</option>

                </select>

                <button type="submit">Check</button>
            </form>

            {% if result %}
                <h3>Result: {{ result }}</h3>
            {% endif %}
        </div>
    </body>
</html>
